<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thanks for voting</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap narrow">
    <div class="card center">
      <div class="check" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="32" height="32"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1 id="heading">Thanks for voting!</h1>
      <p id="message" class="lead">Your vote has been recorded.</p>

      <div id="summary" hidden>
        <p class="muted">Your picks</p>
        <ol id="summary-list" class="summary"></ol>
      </div>

      <a href="./" class="btn btn-ghost">Back to the vote page</a>
    </div>
  </main>

  <script src="config.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      if (params.get("status") === "already") {
        document.getElementById("heading").textContent = "You've already voted";
        document.getElementById("message").textContent =
          "Only one vote per person is allowed. Thanks for taking part!";
        document.querySelector(".check").classList.add("check-info");
      }

      var picks = null;
      try { picks = JSON.parse(localStorage.getItem("vote_picks") || "null"); } catch (e) {}
      if (Array.isArray(picks) && picks.length) {
        var labels = {};
        (window.VOTE_CONFIG.options || []).forEach(function (o) { labels[o.id] = o.label; });
        var list = document.getElementById("summary-list");
        picks.forEach(function (id) {
          var li = document.createElement("li");
          li.textContent = labels[id] || id;
          list.appendChild(li);
        });
        document.getElementById("summary").hidden = false;
      }
    })();
  </script>
</body>
</html>
